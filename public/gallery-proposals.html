</style></head><body><nav aria-label="Propositions de design"><a href="./">themiddleman21</a><div><a href="?design=1">01 · Portés pour de vrai</a><a href="?design=2">02 · Des pièces, des vies</a><a href="?design=3">03 · À leur image</a></div></nav><main><section class="gallery"><div class="heading"><h1></h1><p></p></div><div class="brand" aria-hidden="true">themiddleman21</div><div class="track"></div><div class="footer"><span class="hint">Faites défiler pour parcourir les images.</span><div class="line" aria-hidden="true"><span></span></div><span>Photos issues de nos réseaux.</span></div></section><div class="end"><a href="./">Revenir au site</a></div></main><dialog><button autofocus aria-label="Fermer la photo">Fermer</button><img alt=""></dialog><script type="module">
import{gsap}from'gsap';import{ScrollTrigger}from'gsap/ScrollTrigger';gsap.registerPlugin(ScrollTrigger);
const id=['1','2','3'].includes(new URLSearchParams(location.search).get('design'))?new URLSearchParams(location.search).get('design'):'1';document.body.dataset.design=id;document.querySelector(`[href="?design=${id}"]`).setAttribute('aria-current','page');
const concepts={'1':['Portés pour de vrai.','Le bijou prend sa place.\nDans leur style, dans leur quotidien.'],'2':['Des pièces, des vies.','Des moments partagés.\nDes bijoux qui les accompagnent.'],'3':['À leur image.','Une pièce personnelle.\nUne façon de la porter.']};document.querySelector('h1').textContent=concepts[id][0];document.querySelector('.heading p').innerText=concepts[id][1];
const photos=[['5','Une signature','Portrait avec le collier 93.'],['1','Le détail','Gros plan du pendentif 93 et de sa chaîne.'],['4','La présence','Le pendentif 93 porté sur un maillot.'],['3','Le lien','Deux personnes se serrent la main, le collier 93 porté.'],['2','Le moment','Deux personnes posent ensemble sur un terrain de basket.']];
const dialog=document.querySelector('dialog');for(const[n,title,alt]of photos){const f=document.createElement('figure');f.className='photo';f.innerHTML=`<button aria-label="Agrandir : ${title}"><img src="./assets/reseaux/photo-${n}.webp" alt="${alt}"><figcaption>${title}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></figcaption></button>`;f.querySelector('button').onclick=()=>{dialog.querySelector('img').src=f.querySelector('img').src;dialog.querySelector('img').alt=alt;dialog.showModal()};document.querySelector('.track').append(f)}dialog.querySelector('button').onclick=()=>dialog.close();
const mm=gsap.matchMedia();mm.add('(prefers-reduced-motion: no-preference)',()=>{const track=document.querySelector('.track');const distance=()=>track.scrollWidth-innerWidth;const tl=gsap.timeline({scrollTrigger:{trigger:'.gallery',start:'top top',end:()=>'+='+distance()*1.25,pin:true,scrub:.8,invalidateOnRefresh:true}});tl.to(track,{x:()=>-distance(),duration:1,ease:'none'},0).to('.line span',{scaleX:1,duration:1,ease:'none'},0).to('.brand',{x:-100,duration:1,ease:'none'},0);window.galleryTimeline=tl});document.fonts.ready.then(()=>ScrollTrigger.refresh());
</script></body></html>
